[project]
name = "any-file-translator"
version = "0.1.0"
description = "Multi-format document translation skill for AI Coding IDE"
requires-python = ">=3.8"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "ebooklib>=0.17",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "structlog>=23.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
